<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>現場施工查驗</title>
<meta name="theme-color" content="#1f3a4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* 版面：手機單欄、電腦置中最寬 880px；列印時只輸出 A4 表單 */
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f6f8f9; --line:#d5dde2;
  --ink:#16232d; --ink-2:#51636f; --brand:#1f3a4d; --brand-ink:#ffffff;
  --accent:#d9661f;
  --ok:#1e7d4f; --ok-bg:#e3f3ea; --ng:#c4342b; --ng-bg:#fbe7e5; --na:#6b7780; --na-bg:#eceff1;
  --warn:#a86a00; --warn-bg:#fdf1d8;
  --c-elec:#c98a00; --c-hvac:#1786a3; --c-plumb:#2d5fb8; --c-low:#6f4bb5; --c-fire:#c4342b;
  --font:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171d; --surface:#18232b; --surface-2:#1e2b34; --line:#2c3b46;
  --ink:#e4ebef; --ink-2:#9db0bc; --brand:#24475e; --brand-ink:#ffffff; --accent:#f08a46;
  --ok:#5cc28d; --ok-bg:#163527; --ng:#f07a72; --ng-bg:#3a1d1b; --na:#9aa6ae; --na-bg:#25313a;
  --warn:#e8b14c; --warn-bg:#3a2e14;
  --c-elec:#e0aa2c; --c-hvac:#3db3d1; --c-plumb:#6b97e6; --c-low:#a588e0; --c-fire:#f07a72;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171d; --surface:#18232b; --surface-2:#1e2b34; --line:#2c3b46;
  --ink:#e4ebef; --ink-2:#9db0bc; --brand:#24475e; --brand-ink:#ffffff; --accent:#f08a46;
  --ok:#5cc28d; --ok-bg:#163527; --ng:#f07a72; --ng-bg:#3a1d1b; --na:#9aa6ae; --na-bg:#25313a;
  --warn:#e8b14c; --warn-bg:#3a2e14;
  --c-elec:#e0aa2c; --c-hvac:#3db3d1; --c-plumb:#6b97e6; --c-low:#a588e0; --c-fire:#f07a72;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:40px}
.topbar h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.topbar .sub{display:block;font-size:12px;font-weight:400;opacity:.75}
.iconbtn{background:rgba(255,255,255,.12);border:0;color:inherit;border-radius:8px;min-width:40px;height:40px;padding:0 12px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.iconbtn:hover{background:rgba(255,255,255,.2)}
.iconbtn svg{width:20px;height:20px}

main{max-width:880px;margin:0 auto;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

.label{font-size:12px;letter-spacing:.08em;color:var(--ink-2);font-weight:700;margin:0 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-2);font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.danger{color:var(--ng);border-color:color-mix(in srgb,var(--ng) 40%,var(--line))}
.btn.small{min-height:34px;padding:5px 10px;font-size:13px}
.btn:focus-visible,.iconbtn:focus-visible,.tile:focus-visible,.res button:focus-visible,.rec:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

select,input[type=text],input[type=date],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:42px}
textarea{min-height:72px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--ink-2);font-weight:700}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

/* 標案卡 */
.proj{display:flex;flex-direction:column;gap:10px}
.pswitch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pbtn{border:2px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:16px;min-height:84px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:4px}
.pbtn b{font-size:18px;line-height:1.3;word-break:break-all}
@media (max-width:520px){.pbtn{padding:12px;min-height:96px}.pbtn b{font-size:15px}}
.pbtn span{font-size:13px;color:var(--ink-2)}
.pbtn:hover{border-color:var(--ink-2)}
.pbtn.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.pbtn.on span{color:var(--brand-ink);opacity:.8}
.pbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.proj-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 16px;font-size:13px}
.proj-meta b{color:var(--ink-2);font-weight:400;margin-right:6px}

/* 查驗大項 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.tile:hover{border-color:var(--c)}
.tile .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.tile .ic svg{width:20px;height:20px}
.tile .nm{font-size:18px;font-weight:700}
.tile .ct{font-size:12px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.ng{background:var(--ng-bg);color:var(--ng)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.na{background:var(--na-bg);color:var(--na)}

/* 子項分頁 */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.seg button b{font-size:16px}
.seg button.on{border-color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}

/* 紀錄列表 */
.list{display:flex;flex-direction:column;gap:8px}
.rec{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;width:100%}
.rec:hover{border-color:var(--ink-2)}
.rec .d{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);white-space:nowrap}
.rec .t{flex:1;min-width:0}
.rec .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--ink-2)}

/* 查驗項目 */
.items{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:28px 1fr;gap:6px 10px}
.item.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng-bg) 50%,var(--surface))}
.item .no{font-family:var(--mono);font-weight:700;color:var(--ink-2);padding-top:2px}
.item .tx{min-width:0}
.item .tx b{display:block}
.item .tx small{display:block;color:var(--ink-2);font-size:13px;line-height:1.45}
.item .ctl{grid-column:2;display:flex;flex-direction:column;gap:8px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.res button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;min-height:40px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px}
.res button .sym{font-size:17px;font-weight:700}
.res button.on[data-v=ok]{background:var(--ok);border-color:var(--ok);color:#fff}
.res button.on[data-v=ng]{background:var(--ng);border-color:var(--ng);color:#fff}
.res button.on[data-v=na]{background:var(--na);border-color:var(--na);color:#fff}
.item input[type=text]{min-height:38px;font-size:14px}
.item .rm{justify-self:end;grid-column:2}

/* 照片 */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph .pc{display:flex;gap:4px;padding:6px}
.ph .pc input{min-height:32px;padding:4px 6px;font-size:13px}
.ph .pc button{border:0;background:none;color:var(--ng);cursor:pointer;font-size:13px;white-space:nowrap}

/* 簽名 */
.signs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sign{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.sign .pad{height:80px;border:1px dashed var(--line);border-radius:6px;background:#fff;display:grid;place-items:center;cursor:pointer;color:#8896a0;font-size:13px;overflow:hidden}
.sign .pad img{max-height:100%;max-width:100%}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.savebar-in{max-width:880px;margin:0 auto;display:flex;gap:8px;align-items:center}
.status{font-size:13px;color:var(--ink-2);flex:1;min-width:0}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(10,20,28,.5)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font-size:18px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#sigCanvas{width:100%;height:200px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ===== 列印表單 ===== */
#printArea{display:none}
.print-toolbar{max-width:880px;margin:0 auto}
.preview .sheet{background:#fff;color:#000;margin:0 auto 18px;box-shadow:0 1px 6px rgba(0,0,0,.18);width:210mm;max-width:100%;padding:12mm;overflow-x:auto}
.sheet{font-family:"DFKai-SB","BiauKai","標楷體","Microsoft JhengHei",serif;font-size:11pt;color:#000;line-height:1.35}
.sheet h3{text-align:center;font-size:16pt;margin:0 0 2px;letter-spacing:.05em}
.sheet h4{text-align:center;font-size:13pt;margin:0 0 8px;font-weight:700}
.sheet .fno{text-align:right;font-size:9.5pt;margin-bottom:4px}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
.sheet td,.sheet th{border:1px solid #000;padding:4px 5px;vertical-align:middle;word-break:break-word}
.sheet th{background:#ececec;font-weight:700;text-align:center}
.sheet .k{background:#f3f3f3;font-weight:700;text-align:center;width:16%}
.sheet .c{text-align:center}
.sheet .res-sym{font-size:13pt;font-weight:700;text-align:center}
.sheet .legend{font-size:9.5pt;margin:4px 0 8px}
.sheet .sec{margin-top:8px}
.sheet .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sheet .pgrid figure{margin:0;border:1px solid #000;break-inside:avoid}
.sheet .pgrid img{width:100%;height:58mm;object-fit:cover;display:block}
.sheet .pgrid figcaption{font-size:9.5pt;padding:2px 4px;border-top:1px solid #000;min-height:1.4em}
.sheet .signrow td{height:20mm;text-align:center;vertical-align:middle}
.sheet .signrow img{max-height:18mm;max-width:100%}
.sheet .small{font-size:9.5pt}


/* 排水吊管專用 */
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;font-size:14px;text-align:left}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:12px;color:var(--ink-2);font-weight:700}
.fld.wide{grid-column:1/-1}
.sp2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sp2 label{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ink-2)}
.meas{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.meas label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2)}
.calc{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.calc b{color:var(--ink)} .calc .good{color:var(--ok)} .calc .bad{color:var(--ng)}
.locv{font-weight:700;font-size:16px;padding:6px 0}
.spaces{display:flex;flex-direction:column;gap:14px}
.space{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:10px}
.sphead{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.spno{width:34px;height:34px;border-radius:8px;background:var(--c-plumb);color:#fff;display:grid;place-items:center;font-weight:700;align-self:center}
.pipes{display:flex;flex-direction:column;gap:8px}
.pipe{border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.pipe.vent{border-style:dashed}
.pipe summary{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;list-style:none;font-weight:700}
.pipe summary::-webkit-details-marker{display:none}
.pipe summary::before{content:"▸";color:var(--ink-2);transition:transform .15s}
.pipe[open] summary::before{transform:rotate(90deg)}
.pipe .ps{flex:1;min-width:0;font-size:14px}
.pbody{padding:4px 12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 8px 8px}
.sptools{gap:6px}
.dsheet{font-size:10pt}
.dsheet .dtop{display:flex;justify-content:space-between;font-size:9.5pt;margin-bottom:2px}
.dsheet .dbody{vertical-align:top;line-height:1.5}
.dsheet .dsp{margin-top:4px;break-inside:auto}
.dsheet .dsph{font-weight:700;margin:4px 0 2px}
.dsheet .pp{padding-left:1.2em;font-size:9.5pt;break-inside:avoid}
.dsheet hr{border:0;border-top:1px dashed #000;margin:3px 0 3px 1.2em}
.dsheet .ul{display:inline-block;min-width:2.4em;border-bottom:1px solid #000;text-align:center;padding:0 2px}
.dsheet .dres{margin-top:6px;border-top:1px solid #000;padding-top:4px}
.dsheet .dsign{display:flex;justify-content:space-around;margin-top:10px;font-size:11pt}
.dsheet .dsign div{display:flex;align-items:center;gap:6px;min-height:16mm}
.dsheet .dsign img{max-height:15mm;max-width:40mm}

@page{size:A4 portrait;margin:10mm}
@media print{
  body{background:#fff}
  body::before,.topbar,main,.savebar,.toast,dialog,.print-toolbar{display:none!important}
  #printArea{display:block!important}
  .preview .sheet{box-shadow:none;margin:0;padding:0;width:auto}
  .sheet{page-break-after:always;break-after:page}
  .sheet:last-child{page-break-after:auto;break-after:auto}
  .sheet tr{break-inside:avoid}
  .dsheet tr{break-inside:auto}
}
@media (max-width:520px){
  .preview .sheet{padding:5mm;font-size:9pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <button class="iconbtn" id="backBtn" hidden aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="title">現場施工查驗</h1>
    <button class="iconbtn" id="setBtn" aria-label="資料備份">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg>
      <span>備份</span>
    </button>
  </div>
</header>

<main id="view"></main>

<div class="savebar" id="savebar" hidden><div class="savebar-in" id="savebarIn"></div></div>

<div id="printArea"></div>
<div class="toast" id="toast"></div>

<!-- 標案編輯 -->
<dialog id="projDlg">
  <form class="dlg" id="projForm" method="dialog">
    <h2 id="projDlgTitle">新增標案</h2>
    <div class="fields">
      <label class="field" style="grid-column:1/-1"><span>工程名稱（標案名稱）＊</span><input type="text" id="pf_name" required></label>
      <label class="field"><span>標案編號</span><input type="text" id="pf_no"></label>
      <label class="field"><span>主辦機關</span><input type="text" id="pf_owner"></label>
      <label class="field"><span>專管單位</span><input type="text" id="pf_pm"></label>
      <label class="field"><span>監造單位</span><input type="text" id="pf_sup"></label>
      <label class="field"><span>承攬廠商（營造單位）</span><input type="text" id="pf_con"></label>
    </div>
    <div class="acts">
      <button type="button" class="btn danger" id="projDel" hidden>刪除標案</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="projCancel">取消</button>
      <button type="submit" class="btn primary">儲存</button>
    </div>
  </form>
</dialog>

<!-- 簽名 -->
<dialog id="sigDlg">
  <div class="dlg">
    <h2 id="sigTitle">簽名</h2>
    <canvas id="sigCanvas"></canvas>
    <div class="acts">
      <button type="button" class="btn" id="sigClear">清除</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="sigCancel">取消</button>
      <button type="button" class="btn primary" id="sigOk">確定</button>
    </div>
  </div>
</dialog>

<!-- 備份 -->
<dialog id="setDlg">
  <div class="dlg">
    <h2>資料備份與轉移</h2>
    <p class="muted" style="margin:0">資料只存在這台裝置的瀏覽器裡。要從手機轉到電腦列印，請在手機「匯出備份檔」，再到電腦「匯入備份檔」。匯入會合併資料，相同紀錄以較新的為準。</p>
    <div class="row">

/* ---------- 儲存（IndexedDB） ---------- */
const DB = {
  db:null,
  open(){return new Promise((res,rej)=>{
    const r=indexedDB.open('site-inspection',1);
    r.onupgradeneeded=()=>{const d=r.result;
      if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});
      if(!d.objectStoreNames.contains('records'))d.createObjectStore('records',{keyPath:'id'});};
    r.onsuccess=()=>{this.db=r.result;res()}; r.onerror=()=>rej(r.error);
  })},
  all(s){return new Promise((res,rej)=>{const q=this.db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  put(s,v){return new Promise((res,rej)=>{const t=this.db.transaction(s,'readwrite');t.objectStore(s).put(v);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  del(s,id){return new Promise((res,rej)=>{const t=this.db.transaction(s,'readwrite');t.objectStore(s).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
};
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- 工具 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const rocDate=s=>{if(!s)return '';const [y,m,d]=s.split('-');return `${+y-1911} 年 ${+m} 月 ${+d} 日`};
const cat=k=>CATS.find(c=>c.key===k);
const typ=k=>TYPES.find(t=>t.key===k);
const proj=id=>projects.find(p=>p.id===id);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800)}
function status(r){
  if(r.kind==='drain'){
    const f=r.form;
    if(f.result==='ng') return f.recheck==='ok'?{k:'ok',t:'已改善'}:{k:'ng',t:'待改善'};
    if(f.result==='ok') return {k:'ok',t:'合格'};
    return {k:'warn',t:'填寫中'};
  }
  const ng=r.items.some(i=>i.result==='ng');
  if(ng) return r.recheck==='ok'?{k:'ok',t:'已改善'}:{k:'ng',t:'待改善'};
  if(r.items.length && r.items.every(i=>i.result)) return {k:'ok',t:'合格'};
  return {k:'warn',t:'填寫中'};
}
const SYM={ok:'○',ng:'×',na:'／'};

/* ---------- 路由 ---------- */
function go(h){location.hash=h}
window.addEventListener('hashchange',render);
function setTop(title,back){
  $('#title').innerHTML=title; $('#backBtn').hidden=!back;
  $('#backBtn').onclick=()=>go(back||'home');
  $('#savebar').hidden=true; $('#printArea').innerHTML=''; $('#printArea').className='';
  $('#view').hidden=false; $('#view').oninput=null; $('#view').onclick=null;
}
function render(){
  const h=location.hash.slice(1)||'home';
  const [v,a,b]=h.split('-');
  window.scrollTo(0,0);
  if(v==='cat') return viewCat(a,b||'box');
  if(v==='rec') return viewRec(a);
  if(v==='print') return viewPrint(a);
  if(v==='printall') return viewPrintAll(a,b);
  viewHome();
}

/* ---------- 首頁 ---------- */
function viewHome(){
  setTop('現場施工查驗<span class="sub">標案 ／ 查驗大項</span>',null);
  if(curProj && !proj(curProj)) curProj=null;
  if(!curProj && projects.length) curProj=projects[0].id;
  const p=proj(curProj);
  const recs=records.filter(r=>r.projectId===curProj);
  let html=`<section>
    <p class="label">標案</p>
    <div class="panel proj">
      ${projects.length?`<div class="pswitch" role="tablist" aria-label="切換標案">${projects.map(x=>{
          const n=records.filter(r=>r.projectId===x.id).length;
          return `<button type="button" role="tab" class="pbtn ${x.id===curProj?'on':''}" aria-selected="${x.id===curProj}" data-proj="${x.id}"><b>${esc(x.name)}</b><span class="num">${n} 筆查驗</span></button>`}).join('')}</div>
        <div class="row"><span class="grow muted">目前標案：<b style="color:var(--ink)">${esc(p.name)}</b></span><button class="btn small" id="projEdit">編輯資料</button></div>
        <div class="proj-meta">
          <div><b>標案編號</b>${esc(p.no)||'—'}</div>
          <div><b>主辦機關</b>${esc(p.owner)||'—'}</div>
          <div><b>專管單位</b>${esc(p.pm)||'—'}</div>
          <div><b>監造單位</b>${esc(p.sup)||'—'}</div>
          <div><b>承攬廠商</b>${esc(p.con)||'—'}</div>
        </div>`
      :`<div class="empty">還沒有標案。先新增一個標案，再開始查驗。<div style="margin-top:12px"><button class="btn primary" id="projAdd">＋ 新增標案</button></div></div>`}
    </div></section>`;
  if(p){
    html+=`<section><p class="label">查驗大項</p><div class="tiles">${CATS.map(c=>{
      const rs=recs.filter(r=>r.cat===c.key);
      const ng=rs.filter(r=>status(r).k==='ng').length;
      return `<button class="tile" style="--c:var(--c-${c.key})" data-cat="${c.key}">
        <span class="ic">${ICON[c.key]}</span><span class="nm">${c.name}</span>
        <span class="ct"><span class="num">${rs.length} 筆</span>${ng?`<span class="chip ng">待改善 ${ng}</span>`:''}</span></button>`}).join('')}</div></section>`;
    const recent=[...recs].sort((a,b)=>(b.updated||0)-(a.updated||0)).slice(0,6);
    html+=`<section><p class="label">最近的查驗</p>${recent.length?`<div class="list">${recent.map(recRow).join('')}</div>`:`<div class="empty">這個標案還沒有查驗紀錄。點上方任一查驗大項開始。</div>`}</section>`;
  }
  $('#view').innerHTML=html;
  $('#projAdd')&&($('#projAdd').onclick=()=>openProj());
  $('#projEdit')&&($('#projEdit').onclick=()=>openProj(p));
  document.querySelectorAll('[data-proj]').forEach(b=>b.onclick=()=>{curProj=b.dataset.proj;LS.set('curProj',curProj);viewHome()});
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>go('cat-'+b.dataset.cat+'-box'));
  bindRecRows();
}
function recRow(r){
  const s=status(r), c=cat(r.cat), t=typ(r.type);

    <span class="chip ${s.k}">${s.t}</span></button>`;
}
function bindRecRows(){document.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>go('rec-'+b.dataset.rec))}

/* 照片壓縮：長邊 1280px、JPEG */
function shrink(file){return new Promise((res,rej)=>{
  const fr=new FileReader();fr.onerror=rej;
  fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
    const M=1280,k=Math.min(1,M/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};img.src=fr.result};
  fr.readAsDataURL(file);
})}

cv.addEventListener('pointerdown',e=>{drawing=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);cx.beginPath();cx.moveTo(x,y)});

      </div>

  }else{

    ${fl('支管 實際規格',opts(b+'.brBrand',BRANDS,'many',p.brBrand)+opts(b+'.brSize',V_BR,'one',p.brSize))}
    ${fl('幹管 設計值 Ø',opts(b+'.mnDesign',V_MN,'one',p.mnDesign))}
    ${fl('幹管 實際規格',opts(b+'.mnBrand',BRANDS,'many',p.mnBrand)+opts(b+'.mnSize',V_MN,'one',p.mnSize))}
    ${fl('吊架',`<div class="opts">${chk(b+'.rigid','剛性吊架：50×50×5mm 熱浸鍍鋅角鋼＋U型螺栓',p.rigid)}${chk(b+'.oneStep','吊架間距：僅一步（無間距）',p.oneStep)}</div>`,1)}
    <div class="fld wide"><span>管路高度及通氣立管（cm）</span>
      <div class="meas">
        <label>管路高度 設計${inp(b+'.hD',p.hD,'cm',1)}</label><label>管路高度 實際${inp(b+'.hA',p.hA,'cm',1)}</label>
        <label>接通氣立管 實測（1m 線上）${inp(b+'.stackH',p.stackH,'cm',1)}</label>
      </div>
      <div class="opts">${chk(b+'.toStack','通氣管上端接通氣立管',p.toStack)}</div>
      <div class="calc" data-calc="${si}-${pi}">${calcText(p)}</div>
    </div>`;
  }
  return `<details class="pipe ${p.kind}" ${pi===0?'open':''}><summary><span class="ps" data-sum="${si}-${pi}">${esc(pipeSummary(p,n))}</span>
    <button type="button" class="btn small danger" data-delpipe="${si}-${pi}">刪除</button></summary><div class="pbody">${body}</div></details>`;
}
function calcText(p){
  if(p.kind==='vent'){const h=parseFloat(p.stackH);if(isNaN(h))return '通氣立管接點須位於地板面 90cm 以上';
    return h>=90?`<b class="good">實測 ${h} cm ≥ 90 cm，符合</b>`:`<b class="bad">實測 ${h} cm，低於 90 cm</b>`}
  const s=slopeOf(p);
  if(!s)return '填入管路長度及高、低點實際值後自動計算坡度';
  const t=`高低落差 ${s.drop} cm ÷ 管路長度 ${p.len} cm ＝ <b>${s.pct.toFixed(2)}%</b>`;
  if(s.need==null)return t+'　（請選擇坡度標準）';
  return t+(s.ok?`　<b class="good">≥ ${s.need}%，符合</b>`:`　<b class="bad">未達 ${s.need}%</b>`);
}

    <table class="sec">
      <colgroup><col style="width:7%"><col style="width:22%"><col style="width:38%"><col style="width:9%"><col style="width:24%"></colgroup>
      <tr><th>項次</th><th>檢查項目</th><th>檢查標準</th><th>結果</th><th>實測紀錄／說明</th></tr>
      ${r.items.map((i,n)=>`<tr><td class="c">${n+1}</td><td>${esc(i.t)}</td><td class="small">${esc(i.s)}</td><td class="res-sym">${SYM[i.result]||''}</td><td class="small">${esc(i.note)}</td></tr>`).join('')}
    </table>
    <div class="legend">檢查結果：○ 合格　× 不合格　／ 無此檢查項目</div>
    <table>
      <tr><td class="k">缺失內容</td><td colspan="3">${defect.length?defect.map(esc).join('<br>'):'無'}</td></tr>
      <tr><td class="k">改善情形</td><td colspan="3">${esc(r.fix).replace(/\n/g,'<br>')}</td></tr>
      <tr><td class="k">複查日期</td><td>${rocDate(r.recheckDate)}</td><td class="k">複查結果</td><td>${r.recheck==='ok'?'■已改善合格　□未改善':r.recheck==='ng'?'□已改善合格　■未改善':'□已改善合格　□未改善'}</td></tr>
      ${r.remark?`<tr><td class="k">備註</td><td colspan="3">${esc(r.remark)}</td></tr>`:''}
    </table>
    ${ph.length?`<div class="sec"><div class="pgrid">${ph.map((x,n)=>`<figure><img src="${x.src}" alt=""><figcaption>照片 ${n+1}${x.cap?'：'+esc(x.cap):''}</figcaption></figure>`).join('')}</div></div>`:''}
    <table class="sec">
      <tr>${SIGNERS.map(([,l])=>`<th>${l}</th>`).join('')}</tr>
      <tr class="signrow">${SIGNERS.map(([k])=>`<td>${sg(k).img?`<img src="${sg(k).img}" alt="">`:''}<div class="small">${esc(sg(k).name)}</div></td>`).join('')}</tr>
    </table>
  </div>`;
}
function showPrint(list,back,title){
  setTop(title,back);
  $('#view').hidden=true;
  const pa=$('#printArea');
  pa.className='preview';
  pa.style.display='block';
  pa.innerHTML=`<div class="print-toolbar" style="padding:16px max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <span class="muted grow">A4 直式預覽，共 ${list.length} 張。電腦請按「列印」，或選「另存為 PDF」。</span>
      <button class="btn primary" id="doPrint">列印</button></div>
    <div style="padding:0 max(16px,env(safe-area-inset-left,0px)) 40px">${list.map(r=>r.kind==='drain'?drainSheet(r):sheetHTML(r)).join('')}</div>`;
  $('#doPrint').onclick=()=>window.print();
}
function viewPrint(id){
  const r=records.find(x=>x.id===id);if(!r)return go('home');
  showPrint([r],'rec-'+id,`列印預覽<span class="sub">${esc(r.formNo)}</span>`);
}
function viewPrintAll(ck,tk){
  const list=records.filter(r=>r.projectId===curProj&&r.cat===ck&&r.type===tk).sort((a,b)=>a.date.localeCompare(b.date));
  if(!list.length)return go(`cat-${ck}-${tk}`);
  showPrint(list,`cat-${ck}-${tk}`,`列印預覽<span class="sub">${cat(ck).name}・${typ(tk).name}</span>`);
}
const _setTop=setTop;
setTop=function(t,b){_setTop(t,b);$('#printArea').style.display=''};

/* ---------- 備份 ---------- */
$('#setBtn').onclick=async()=>{
  try{const e=await navigator.storage?.estimate?.();$('#usage').textContent=e?`已使用約 ${(e.usage/1048576).toFixed(1)} MB／可用約 ${(e.quota/1048576).toFixed(0)} MB`:''}catch(_){}
  $('#ver').textContent=APP_VERSION;$('#setDlg').showModal()};
$('#setClose').onclick=()=>$('#setDlg').close();
$('#expBtn').onclick=async()=>{
  await flush();
  const blob=new Blob([JSON.stringify({app:'site-inspection',v:1,exported:new Date().toISOString(),projects,records})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`施工查驗備份_${today()}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('備份檔已下載');
};
$('#impFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(d.app!=='site-inspection')throw 0;
    let np=0,nr=0;
    for(const p of d.projects||[]){const o=proj(p.id);if(!o||(p.updated||0)>(o.updated||0)){await DB.put('projects',p);np++}}
    for(const r of d.records||[]){const o=records.find(x=>x.id===r.id);if(!o||(r.updated||0)>(o.updated||0)){await DB.put('records',r);nr++}}
    projects=await DB.all('projects');records=await DB.all('records');
    toast(`已匯入 ${np} 個標案、${nr} 筆查驗`);$('#setDlg').close();render();
  }catch(_){toast('這不是本 APP 的備份檔')}
  e.target.value='';
};

/* ---------- 啟動 ---------- */
(async()=>{
  try{await DB.open();projects=await DB.all('projects');records=await DB.all('records');
    // 首次開啟時預設建立標案（固定 id，手機與電腦匯入備份時會合併成同一個；刪除後不會再自動出現）
    if(!LS.get('seeded2')){
      const PRESET=[
        {id:'p-nycuh-med2',name:'第二期醫療大樓興建工程',owner:'國立陽明交通大學附設醫院',pm:'誠蓄工程顧問股份有限公司',sup:'劉培森建築師事務所',con:'崇偉營造工程(股)有限公司'},
        {id:'p-nycuh-dorm',name:'職務宿舍興建工程',owner:'國立陽明交通大學附設醫院',pm:'誠蓄工程顧問(股)公司',sup:'劉培森建築師事務所',con:'崇偉營造工程(股)有限公司'}];
      for(const x of PRESET){if(!proj(x.id)){const p={...x,no:'',created:Date.now(),updated:1};await DB.put('projects',p);projects.push(p)}}
      if(!curProj)curProj=PRESET[0].id;
    }
    LS.set('seeded2','1');}
  catch(e){$('#view').innerHTML='<div class="empty">此瀏覽器無法儲存資料（可能是無痕模式）。請改用一般模式開啟。</div>';return}
  render();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
