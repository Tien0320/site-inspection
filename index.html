<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>現場施工查驗</title>
<meta name="theme-color" content="#1f3a4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* 版面：手機單欄、電腦置中最寬 880px；列印時只輸出 A4 表單 */
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f6f8f9; --line:#d5dde2;
  --ink:#16232d; --ink-2:#51636f; --brand:#1f3a4d; --brand-ink:#ffffff;
  --accent:#d9661f;
  --ok:#1e7d4f; --ok-bg:#e3f3ea; --ng:#c4342b; --ng-bg:#fbe7e5; --na:#6b7780; --na-bg:#eceff1;
  --warn:#a86a00; --warn-bg:#fdf1d8;
  --c-elec:#c98a00; --c-hvac:#1786a3; --c-plumb:#2d5fb8; --c-low:#6f4bb5; --c-fire:#c4342b; --c-beam:#c2185b;
  --font:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171d; --surface:#18232b; --surface-2:#1e2b34; --line:#2c3b46;
  --ink:#e4ebef; --ink-2:#9db0bc; --brand:#24475e; --brand-ink:#ffffff; --accent:#f08a46;
  --ok:#5cc28d; --ok-bg:#163527; --ng:#f07a72; --ng-bg:#3a1d1b; --na:#9aa6ae; --na-bg:#25313a;
  --warn:#e8b14c; --warn-bg:#3a2e14;
  --c-elec:#e0aa2c; --c-hvac:#3db3d1; --c-plumb:#6b97e6; --c-low:#a588e0; --c-fire:#f07a72; --c-beam:#f06fa4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171d; --surface:#18232b; --surface-2:#1e2b34; --line:#2c3b46;
  --ink:#e4ebef; --ink-2:#9db0bc; --brand:#24475e; --brand-ink:#ffffff; --accent:#f08a46;
  --ok:#5cc28d; --ok-bg:#163527; --ng:#f07a72; --ng-bg:#3a1d1b; --na:#9aa6ae; --na-bg:#25313a;
  --warn:#e8b14c; --warn-bg:#3a2e14;
  --c-elec:#e0aa2c; --c-hvac:#3db3d1; --c-plumb:#6b97e6; --c-low:#a588e0; --c-fire:#f07a72; --c-beam:#f06fa4;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:40px}
.topbar h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.topbar .sub{display:block;font-size:12px;font-weight:400;opacity:.75}
.iconbtn{background:rgba(255,255,255,.12);border:0;color:inherit;border-radius:8px;min-width:40px;height:40px;padding:0 12px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.iconbtn:hover{background:rgba(255,255,255,.2)}
.iconbtn svg{width:20px;height:20px}

main{max-width:880px;margin:0 auto;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

.label{font-size:12px;letter-spacing:.08em;color:var(--ink-2);font-weight:700;margin:0 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-2);font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.danger{color:var(--ng);border-color:color-mix(in srgb,var(--ng) 40%,var(--line))}
.btn.small{min-height:34px;padding:5px 10px;font-size:13px}
.btn:focus-visible,.iconbtn:focus-visible,.tile:focus-visible,.res button:focus-visible,.rec:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

select,input[type=text],input[type=date],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:42px}
textarea{min-height:72px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--ink-2);font-weight:700}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

/* 標案卡 */
.proj{display:flex;flex-direction:column;gap:10px}
.pswitch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pbtn{border:2px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:16px;min-height:84px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:4px}
.picon{width:44px;height:44px;flex:none}
.ipair{display:flex;align-items:center;gap:10px}.itxt{display:flex;flex-direction:column;gap:2px;min-width:0}
.pbtn .ipair,.pbtn .itxt,.pbtn.on .ipair,.pbtn.on .itxt,.mseg button .ipair,.mseg button .itxt,.mseg button.on .ipair,.mseg button.on .itxt{color:inherit;opacity:1;font-size:inherit}
.pbtn.on .itxt .num,.mseg button.on .itxt .num{opacity:.8}
.pbtn b{font-size:18px;line-height:1.3;word-break:break-all}
@media (max-width:520px){.pbtn{padding:12px;min-height:96px}.pbtn b{font-size:15px}}
.pbtn span{font-size:13px;color:var(--ink-2)}
.pbtn.bigpick{min-height:150px;align-items:center;justify-content:center;text-align:center}
.pbtn.bigpick b{font-size:26px}
.pbtn:hover{border-color:var(--ink-2)}
.pbtn.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.pbtn.on span{color:var(--brand-ink);opacity:.8}
.pbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.proj-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 16px;font-size:13px}
.proj-meta b{color:var(--ink-2);font-weight:400;margin-right:6px}

/* 查驗大項 */
.tile .nmsub{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.tile:hover{border-color:var(--c)}
.tile .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.tile .ic svg{width:20px;height:20px}
.tile .nm{font-size:18px;font-weight:700}
.tile .ct{font-size:12px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.ng{background:var(--ng-bg);color:var(--ng)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.na{background:var(--na-bg);color:var(--na)}

/* 子項分頁 */
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.seg.seg1{grid-template-columns:minmax(0,1fr)}
.axis{display:flex;align-items:center;gap:4px}
.axis input{width:0;flex:1;min-width:0;text-align:center;font-family:var(--mono)}
.axis i,.axis b{font-style:normal;color:var(--ink-2);font-weight:700;padding:0 2px}
.toptabs{max-width:880px;margin:8px auto 0}
.zonetabs{flex-wrap:wrap;margin-bottom:4px}
.syssel{align-self:center;width:auto;min-height:32px;padding:2px 8px;border-radius:999px;border:1.5px solid var(--c);color:var(--c);font-weight:700;background:var(--surface)}
.stabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.toptabs .stabs button{background:rgba(255,255,255,.12);border-color:transparent;color:var(--brand-ink)}
.syspill{display:inline-block;border:1.5px solid var(--c);color:var(--c);border-radius:999px;padding:0 9px;font-size:12px;font-weight:700;line-height:20px;margin-right:4px;vertical-align:middle}
.toptabs .stabs button .num{color:var(--brand-ink);opacity:.75}
.toptabs .stabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.stabs button .num{font-size:12px;color:var(--ink-2)}
.stabs button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.stabs button.on .num{color:var(--brand-ink)}
.stabs button[style*="--c"]{border-color:var(--c);color:var(--c);border-width:1.5px}
.stabs button[style*="--c"].on{background:var(--c);border-color:var(--c);color:#fff}
.stabs button[style*="--c"].on .num{color:#fff}
.toptabs .stabs button[style*="--c"]{background:rgba(255,255,255,.08);border-color:var(--c);color:var(--brand-ink)}
.toptabs .stabs button[style*="--c"].on{background:var(--c);color:#fff}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.hm{display:flex;align-items:center;gap:4px}.hm input{flex:1;min-width:0;text-align:center;font-family:var(--mono)}.hm b{font-size:18px;color:var(--ink)}
.addgrp{width:100%;border:2px dashed var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:700}
.trow{flex-wrap:wrap}.trow .tbtns{display:flex;gap:6px;width:100%;justify-content:flex-end}
.bkwrap{display:inline-flex;flex-direction:column;align-items:center;gap:2px;margin-right:6px}.bkwrap .muted{font-size:11px}
.chipx{border:0;background:transparent;color:inherit;cursor:pointer;padding:0 0 0 4px;font-size:12px}
.tsheet hr.tsep{border:0;border-top:1px dashed #000;margin:2px 0}
.fld.dm2{display:grid!important;grid-template-columns:1fr 1fr;gap:10px 14px;align-items:start}.dm2>.fld{min-width:0}
.eqbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:42px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:15px;text-align:left;cursor:pointer}.eqcaret{color:var(--ink-2)}
.eqmenu{position:absolute;z-index:60;display:flex;align-items:flex-start;gap:4px;font-size:15px}.eqmenu.narrow{flex-direction:column}
.eqcol{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);padding:4px;min-width:180px;max-width:min(420px,92vw);max-height:60vh;overflow:auto}
.eqit{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}.eqit:hover,.eqit.open{background:var(--surface-2)}.eqit.on{background:var(--accent);color:#fff}
.eqsys{color:var(--ec);font-weight:700}.eqsys.on{background:var(--ec);color:#fff}.eqsub{border-color:var(--ec)}.eqback{cursor:pointer;color:var(--ink-2);font-weight:400}.eqhd{padding:6px 10px;font-weight:700;color:var(--ec);border-bottom:1px solid var(--line);margin-bottom:2px}
.tgrp{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface-2)}.tgrp-h{display:flex;gap:6px;align-items:center}.tgrp-h select,.tgrp-h input{flex:1;min-width:0;min-height:40px}.tgrp-h .muted{font-size:12px;white-space:nowrap}
.tsys{display:flex;gap:6px;flex:1;min-width:0}.tsys select{flex:1;min-width:0;min-height:40px}
.tgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2)}
.tgrid input,.tgrid select{min-height:40px;padding:6px 8px}
.tdur{min-height:40px;display:flex;align-items:center;font-weight:700;color:var(--ink);font-family:var(--mono)}
.tsheet td,.tsheet th{font-size:9.5pt;padding:2px 4px;line-height:1.25}
.tsheet .k{word-break:keep-all}
.tsheet .small{font-size:8.5pt;line-height:1.2}
.mseg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.mseg button{border:0;background:transparent;padding:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.mseg button+button{border-left:1px solid var(--line)}
.mseg button b{font-size:16px}
.micon{width:38px;height:38px;flex:none}
.mseg.big button{min-height:76px}
.mseg.big button b{font-size:19px}
.mseg button span{font-size:12px;color:var(--ink-2)}
.mseg button.on{background:var(--brand);color:var(--brand-ink)}
.mseg button.on span{color:var(--brand-ink);opacity:.8}
.mseg button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.seg button b{font-size:16px}
.seg button.on{border-color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}

/* 紀錄列表 */
.list{display:flex;flex-direction:column;gap:8px}
.rec{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;width:100%}
.rec:hover{border-color:var(--ink-2)}
.rec .d{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);white-space:nowrap}
.rec .t{flex:1;min-width:0}
.rec .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--ink-2)}

/* 查驗項目 */
.items{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:28px 1fr;gap:6px 10px}
.item.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng-bg) 50%,var(--surface))}
.item .no{font-family:var(--mono);font-weight:700;color:var(--ink-2);padding-top:2px}
.item .tx{min-width:0}
.item .tx b{display:block}
.item .tx small{display:block;color:var(--ink-2);font-size:13px;line-height:1.45}
.item .ctl{grid-column:2;display:flex;flex-direction:column;gap:8px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.res button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;min-height:40px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px}
.res button .sym{font-size:17px;font-weight:700}
.res button.on[data-v=ok]{background:var(--ok);border-color:var(--ok);color:#fff}
.res button.on[data-v=ng]{background:var(--ng);border-color:var(--ng);color:#fff}
.res button.on[data-v=na]{background:var(--na);border-color:var(--na);color:#fff}
.item input[type=text]{min-height:38px;font-size:14px}
.item .rm{justify-self:end;grid-column:2}

/* 照片 */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph .pc{display:flex;gap:4px;padding:6px}
.ph .pc input{min-height:32px;padding:4px 6px;font-size:13px}
.ph .pc button{border:0;background:none;color:var(--ng);cursor:pointer;font-size:13px;white-space:nowrap}

/* 簽名 */
.signs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sign{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.sign .pad{height:80px;border:1px dashed var(--line);border-radius:6px;background:#fff;display:grid;place-items:center;cursor:pointer;color:#8896a0;font-size:13px;overflow:hidden}
.sign .pad img{max-height:100%;max-width:100%}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.savebar-in{max-width:880px;margin:0 auto;display:flex;gap:8px;align-items:center}
.status{font-size:13px;color:var(--ink-2);flex:1;min-width:0}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(10,20,28,.5)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font-size:18px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#sigCanvas{width:100%;height:200px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none}

.cloudchip{gap:6px;font-size:13px;padding:0 10px}
.cloudchip .dot{width:9px;height:9px;border-radius:50%;background:#9aa6ae;flex:none}
.cloudchip[data-s=synced] .dot{background:#4cd18a}
.cloudchip[data-s=syncing] .dot{background:#f2b33d;animation:blink 1s infinite}
.cloudchip[data-s=error] .dot,.cloudchip[data-s=signedout] .dot{background:#f07a72}
@keyframes blink{50%{opacity:.3}}
.bkbtn{flex-direction:column;justify-content:center;gap:0;line-height:1.15;padding:0 10px;height:44px}.bkbtn b{font-size:14px}.bkbtn small{font-size:11px;opacity:.8;font-family:var(--mono)}
.cloudbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.cloudbox textarea{font-family:var(--mono);font-size:12px;min-height:120px}
.ph .wait{aspect-ratio:4/3;display:grid;place-items:center;color:var(--ink-2);font-size:13px}
.phstrip{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pht{position:relative;width:76px;height:76px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.pht img{width:100%;height:100%;object-fit:cover;display:block}
.pht .w{display:grid;place-items:center;height:100%;font-size:11px;color:var(--ink-2)}
.pht b{position:absolute;left:3px;top:3px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;line-height:1.4;padding:0 5px;border-radius:4px;font-family:var(--mono)}
.pht button{position:absolute;right:3px;top:3px;border:0;border-radius:4px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;line-height:1.5;padding:0 5px;cursor:pointer}
.phadd{width:76px;height:76px;border:1.5px dashed var(--ink-2);border-radius:6px;display:grid;place-items:center;font-size:13px;color:var(--ink-2);cursor:pointer;background:var(--surface)}
.okbtn{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.phadd:hover{border-color:var(--accent);color:var(--accent)}

<script>
"use strict";
const APP_VERSION='2026.11.06-90';
/* ---------- 基本設定 ---------- */
const ICON = {
  elec:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',

  plumb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0013 0C18.5 10 12 2.5 12 2.5z"/></svg>',
  low:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 9a15 15 0 0120 0M5.5 12.5a10 10 0 0113 0M9 16a5 5 0 016 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/></svg>',
  beam:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/></svg>',
  fire:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 22c4 0 7-2.8 7-6.8 0-4.6-4-7-4.5-11.2C11 6 9 9 9.5 12 8 11.3 7 9.8 7 8.5 5.6 10.2 5 12.6 5 15.2 5 19.2 8 22 12 22z"/></svg>'
};
const CATS = [
  {key:'elec', name:'電氣',  code:'E'},
  {key:'hvac', name:'空調',  code:'A'},
  {key:'plumb',name:'給排水',code:'P'},
  {key:'low',  name:'弱電',  code:'L'},
  {key:'fire', name:'消防',  code:'F'},
  {key:'beam', name:'其他', code:'S'}
];
const TYPES = [
  {key:'box',  name:'柱/牆接線盒', code:'B', hint:'柱/牆預埋盒＋配管'},
  {key:'slab', name:'樓板接線盒', code:'S', hint:'樓板預埋盒＋配管'},
  {key:'hang', name:'吊管',       code:'H', hint:'吊架及管路'}
];
const STAGES = ['施工前','施工中','施工完成'];
const PLUMB_TYPES = [
  {key:'hang', name:'吊管',   code:'H', hint:'吊架及管路'},
  {key:'box',  name:'預埋管', code:'B', hint:'澆置混凝土前'},
  {key:'test', name:'試水',   code:'T', hint:'壓力／滿水試驗'}
];
const BEAM_TYPES = [{key:'sleeve', name:'穿樑', code:'', hint:'穿樑套管・澆置混凝土前'},{key:'wall', name:'穿牆', code:'W', hint:'穿牆套管・澆置混凝土前'}];
const typesOf = ck => ck==='plumb' ? PLUMB_TYPES : ck==='beam' ? BEAM_TYPES : TYPES;
const typN = (ck,tk) => typesOf(ck).find(t=>t.key===tk) || typ(tk);
const MODES = [
  {key:'work', name:'施工查驗', code:'',  hint:'現場施工品質'},
  {key:'mat',  name:'材料查驗', code:'',  hint:'材料進場檢驗'}
];
const modeOf = r => r.mode || 'work';
const typeName = r => modeOf(r)==='mat' ? (MAT_TYPES.find(t=>t.key===r.type)||{name:r.type}).name+(r.sub&&typeof SUB_NAME!=='undefined'?' '+SUB_NAME[r.sub]:'') : typN(r.cat,r.type).name;
/* 樓板接線盒可含多系統：在各系統頁也列出含該系統接線盒的紀錄 */
/* 樓板／柱牆接線盒可含多系統：依各處實際選的系統歸類（沒選系統時才用建立時的類別） */
const recUnits=list=>list.reduce((n,r)=>n+(modeOf(r)==='work'?Math.max(1,slabSyss(r).length):1),0); // 一張含多系統的接線盒算多筆（依系統各一張表）
const slabSyss=r=>r.kind==='slab'?[...new Set((r.form?.items||[]).map(x=>x.sys).filter(Boolean))]:[];
const inCat=(r,ck)=>{const ss=slabSyss(r);if(ss.length&&typeof SYS_OF!=='undefined')return ss.some(s=>s===SYS_OF[ck]||(ck==='beam'&&s==='其他'));return r.cat===ck};

/* ---------- 儲存（IndexedDB） ---------- */
const DB = {
  db:null,
  open(){return new Promise((res,rej)=>{
    const r=indexedDB.open('site-inspection',1);
    r.onupgradeneeded=()=>{const d=r.result;
      if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});
      if(!d.objectStoreNames.contains('records'))d.createObjectStore('records',{keyPath:'id'});};
    r.onsuccess=()=>{this.db=r.result;res()}; r.onerror=()=>rej(r.error);
  })},
  all(s){return new Promise((res,rej)=>{const q=this.db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  put(s,v){return new Promise((res,rej)=>{const t=this.db.transaction(s,'readwrite');t.objectStore(s).put(v);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  del(s,id){return new Promise((res,rej)=>{const t=this.db.transaction(s,'readwrite');t.objectStore(s).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
};
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* 刪除暫存區：刪除的表單先標記 deleted，保留 7 天可復原，之後自動永久刪除（雲端同步，其他裝置也看得到） */
const TRASH_DAYS=7,DAY=864e5;
function splitTrash(){const all=[...records,...trash];records=all.filter(r=>!r.deleted);trash=all.filter(r=>r.deleted)}
async function purgeTrash(){const lim=Date.now()-TRASH_DAYS*DAY,old=trash.filter(r=>r.deleted<lim);trash=trash.filter(r=>r.deleted>=lim);for(const r of old)await DB.del('records',r.id,r)}
async function trashRec(r){r.deleted=Date.now();r.updated=Date.now();if(cur===r)cur=null;records=records.filter(x=>x.id!==r.id);trash.push(r);await DB.put('records',r)}
async function restoreRec(r){delete r.deleted;r.updated=Date.now();trash=trash.filter(x=>x.id!==r.id);records.push(r);await DB.put('records',r)}
const trashLeft=r=>Math.max(0,Math.ceil((r.deleted+TRASH_DAYS*DAY-Date.now())/DAY));

const cat=k=>k==='mat'?MAT_CAT:CATS.find(c=>c.key===k);
const typ=k=>TYPES.find(t=>t.key===k)||MAT_TYPES.find(t=>t.key===k)||{key:k,name:k,code:''};
const proj=id=>projects.find(p=>p.id===id);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800)}
function status(r){const b=baseStatus(r);return r.done&&b.k!=='ng'?{k:'ok',t:'完成'}:b}
function baseStatus(r){
  if(r.kind==='wtest') return testStatus(r);
  if(r.kind==='sleeve'||r.kind==='slab'||r.kind==='dfit') return sleeveStatus(r);
  if(r.kind==='drain'){
    const f=r.form;
    if(f.result==='ng') return f.recheck==='ok'?{k:'ok',t:'已改善'}:{k:'ng',t:'待改善'};
    if(f.result==='ok') return {k:'ok',t:'合格'};
    return {k:'warn',t:'填寫中'};
  }
  const ng=r.items.some(i=>i.result==='ng');
  if(ng) return r.recheck==='ok'?{k:'ok',t:'已改善'}:{k:'ng',t:'待改善'};
  if(r.items.length && r.items.every(i=>i.result)) return {k:'ok',t:'合格'};
  return {k:'warn',t:'填寫中'};
}

let lastHash=location.hash;
function draftOf(h){if(!/^#rec-/.test(h))return null;const r=records.find(x=>x.id===h.slice(5));return r&&r.isNew?r:null}
window.addEventListener('hashchange',()=>{
  const from=lastHash,to=location.hash,r=draftOf(from);
  if(r&&to!=='#print-'+r.id&&to!==from){history.pushState(null,'',from);askLeave(r,to);return}
  lastHash=to;render();
});
function askLeave(r,to){
  let d=$('#leaveDlg');
  if(!d){d=document.createElement('dialog');d.id='leaveDlg';d.innerHTML=`<div class="dlg"><h2>要儲存這份新的檢查表嗎？</h2>
    <p class="muted" style="margin:0">選「不儲存」會刪除這份剛新增的檢查表。</p>
    <div class="acts"><button class="btn danger" id="lvDiscard" type="button">不儲存</button><span class="grow"></span>
    <button class="btn" id="lvCancel" type="button">繼續編輯</button><button class="btn primary" id="lvSave" type="button">儲存</button></div></div>`;document.body.appendChild(d)}
  const go2=()=>{d.close();lastHash=location.hash;location.hash=to};
  $('#lvCancel').onclick=()=>d.close();
  $('#lvSave').onclick=async()=>{delete r.isNew;r.updated=Date.now();if(cur===r)await flush();else await DB.put('records',r);toast('已儲存');go2()};
  $('#lvDiscard').onclick=async()=>{clearTimeout(saveTimer);await DB.del('records',r.id);records=records.filter(x=>x.id!==r.id);if(cur===r)cur=null;toast('已捨棄');go2()};
  d.showModal();
}
function setTop(title,back){
  $('#title').innerHTML=title; $('#backBtn').hidden=!back;
  $('#topTabs').hidden=true;
  $('#backBtn').onclick=()=>go(back||'home');
  $('#savebar').hidden=true; $('#printArea').innerHTML=''; $('#printArea').className='';
  $('#view').hidden=false; $('#view').oninput=null; $('#view').onclick=null; $('#view').onchange=null;
}
function render(){
  const h=location.hash.slice(1)||'home';
  const [v,a,b,m]=h.split('-');
  window.scrollTo(0,0);
  if(v==='cat') return viewCat(a,b||'box',m||LS.get('mode')||'work');
  if(v==='mat') return viewMat(a||'pipe');
  if(v==='zone') return viewZone(a,b);
  if(v==='rec') return viewRec(a);
  if(v==='trash') return viewTrash();
  if(v==='print') return viewPrint(a);
  if(v==='view') return viewPreview(a);
  if(v==='printall') return viewPrintAll(a,b,m||'work');
  viewHome();
}

function shrink(file){return new Promise((res,rej)=>{
  const fr=new FileReader();fr.onerror=rej;
  fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
    const M=1280,k=Math.min(1,M/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=.72,out=c.toDataURL('image/jpeg',q);while(out.length>700000&&q>.35){q-=.1;out=c.toDataURL('image/jpeg',q)}res(out)};img.src=fr.result};
  fr.readAsDataURL(file);
})}

function calcText(p){
  if(p.kind==='vent'){const h=parseFloat(p.stackH);if(isNaN(h))return '通氣立管接點須位於地板面 90cm 以上';
    return h>=90?`<b class="good">實測 ${h} cm ≥ 90 cm，符合</b>`:`<b class="bad">實測 ${h} cm，低於 90 cm</b>`}
  const s=slopeOf(p);
  if(!s)return '填入管路長度及高、低點實際值後自動計算坡度';
  const t=`高低落差 ${s.drop} cm ÷ 管路長度 ${p.len} cm ＝ <b>${s.pct.toFixed(2)}%</b>`;

  return t+(s.ok?`　<b class="good">≥ ${s.need}%，符合</b>`:`　<b class="bad">未達 ${s.need}%</b>`);
}

function zoneMatch(z,s,r){
  if(modeOf(r)!=='work')return false;
  if(z==='slab'){if(s==='plumb')return r.kind==='dfit';return r.kind==='slab'&&!isWallBox(r)&&inCat(r,s)}
  if(s==='wallsl')return r.cat==='beam'&&r.type==='wall';
  if(s==='plumb')return r.cat==='plumb'&&r.type==='box'&&r.kind!=='dfit';
  if(isWallBox(r))return r.type==='box'&&inCat(r,s);
  return r.cat===s&&r.type==='box'&&!r.kind;
}
function zoneNew(z,s){
  zoneBackPending=`zone-${z}-${s}`;
  if(z==='slab')return s==='plumb'?newRec('plumb','box','work','dfit'):newRec(s,'slab','work');

async function saveBlob(blob,name,mime,ext,desc){
  if(window.showSaveFilePicker){
    try{const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:desc,accept:{[mime]:[ext]}}]});const w=await h.createWritable();await w.write(blob);await w.close();return 'saved'}
    catch(e){if(e&&e.name==='AbortError')return 'cancel'}}
  try{const f=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})&&/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)){await navigator.share({files:[f],title:name});return 'shared'}}
  catch(e){if(e&&e.name==='AbortError')return 'cancel'}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return 'download'}

async function downloadPDF(btn){
  const pa=$('#printArea'),sheets=[...pa.querySelectorAll('.psheets .sheet')];if(!sheets.length)return;
  const tl=($('#title').innerText||'').split('\n').map(x=>x.trim()).filter(Boolean),pdfName=((tl[0]==='列印預覽'&&tl[1]?tl[1]:tl[0])||'施工查驗').replace(/[\\/:*?"<>|\s]+/g,'_')+'_'+today()+'.pdf';

  // 電腦：先選資料夾與檔名（必須在點擊當下開啟），再產生
  let handle=null;
  if(window.showSaveFilePicker){try{handle=await window.showSaveFilePicker({suggestedName:pdfName,types:[{description:'PDF 檔',accept:{'application/pdf':['.pdf']}}]})}catch(e){if(e&&e.name==='AbortError'){toast('已取消');return}}}

    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});const W=210,H=297;
    for(let i=0;i<sheets.length;i++){btn.textContent=`產生中 ${i+1}/${sheets.length}`;
      const c=await html2canvas(sheets[i],{scale:2,backgroundColor:'#fff',useCORS:true,windowWidth:1000});
      const ph=c.height*W/c.width,pagePx=Math.floor(c.width*H/W);
      for(let y=0,k=0;y<c.height-2;y+=pagePx,k++){
        const h=Math.min(pagePx,c.height-y),part=document.createElement('canvas');part.width=c.width;part.height=h;part.getContext('2d').drawImage(c,0,y,c.width,h,0,0,c.width,h);
        if(i||k)pdf.addPage();pdf.addImage(part.toDataURL('image/jpeg',0.9),'JPEG',0,0,W,h*W/c.width);
        if(ph<=H)break}}
    const name=pdfName;
    const blob=pdf.output('blob');
    if(handle){const w=await handle.createWritable();await w.write(blob);await w.close();toast('PDF '+SAVE_MSG.saved)}
    else if(navigator.canShare&&/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)&&navigator.canShare({files:[new File([blob],name,{type:'application/pdf'})]})){
      pdfReady={blob,name,btn};btn.disabled=false;btn.textContent='📤 儲存 PDF';toast('PDF 已產生，請再按「儲存 PDF」選擇存放位置');pa.classList.remove('pdfcap');return}
    else{const r=await saveBlob(blob,name,'application/pdf','.pdf','PDF 檔');toast('PDF '+SAVE_MSG[r])}
  }catch(e){toast(navigator.onLine?'PDF 產生失敗，請改用「列印」→ 另存為 PDF':'需要網路才能產生 PDF，請改用「列印」→ 另存為 PDF')}
  finally{pa.classList.remove('pdfcap');btn.disabled=false;if(!pdfReady)btn.textContent=old}
}

    const list=isR?[...records,...trash]:projects,map=new Map(list.map(x=>[x.id,x]));
    s.docs.forEach(d=>{const v=d.data(),o=map.get(d.id);ids.add(d.id);
      if(o&&(o.updated||0)>(v.updated||0))return;                                   // 本機較新，等待上傳
      if(isR&&o&&o===cur&&location.hash==='#rec-'+d.id&&(o.updated||0)>=(v.updated||0))return; // 正在編輯
      if(isR)v.photos=(v.photos||[]).map(p=>({...p,up:true,src:o&&o.photos&&(o.photos.find(x=>x.id===p.id)||{}).src}));
      map.set(d.id,v);_put(kind,v)});
    if(!s.metadata.fromCache){
      for(const id of [...map.keys()])if(!ids.has(id)&&seen.has(id)){map.delete(id);_del(kind,id)} // 其他裝置已刪除
      ids.forEach(i=>seen.add(i));this.keep(k,seen);
    }
    if(isR){records=[...map.values()];trash=[];splitTrash();purgeTrash();splitSlabRecords().then(c=>{if(c)softRender()})}else projects=[...map.values()];
    this.pending();softRender();
  },
  docOf(kind,v){return clean(kind==='records'?{...v,photos:(v.photos||[]).map(p=>({id:p.id,cap:p.cap||'',ref:p.ref||'',seq:p.seq||0,...(p.tag?{tag:p.tag}:{}),...(p.fit?{fit:p.fit}:{})}))}:v)},
  push(kind,v){
    if(!this.on)return;
    try{
      if(kind==='records')for(const p of v.photos||[]){if(p.src&&!p.up){this.fs.collection('photos').doc(p.id).set({rec:v.id,data:p.src}).catch(e=>this.fail(e));p.up=true}}
      this.fs.collection(kind).doc(v.id).set(this.docOf(kind,v)).catch(e=>this.fail(e));
      this.pending();
    }catch(e){this.fail(e)}
  },
  remove(kind,id,old){
    if(!this.on)return;
    this.fs.collection(kind).doc(id).delete().catch(e=>this.fail(e));
    ((old&&old.photos)||[]).forEach(p=>p.id&&this.delPhoto(p.id));
    const k=kind==='records'?'r':'p',seen=this.seen(k);seen.delete(id);this.keep(k,seen);this.pending();
  },
  delPhoto(id){if(this.on)this.fs.collection('photos').doc(id).delete().catch(()=>{})},
  fail(e){if(e.code==='permission-denied')this.denied=true;this.set('error',e.code==='permission-denied'?`此帳號（${this.user&&this.user.email}）沒有權限，請聯絡管理者加入`:(e.message||String(e)))},
  pending(){
    if(!this.on||this.denied)return;
    this.set(navigator.onLine?'syncing':'offline',navigator.onLine?'':'恢復網路後會自動上傳');
    const t=this.pendT={};
    this.fs.waitForPendingWrites().then(()=>{if(this.pendT===t&&this.state!=='error')this.set(navigator.onLine?'synced':'offline')});
  },
  async migrate(){ // 本機有、雲端沒有（或本機較新）的資料上傳
    if(!this.on)return 0;
    let n=0;
    try{
      for(const [kind,list,k] of [['projects',projects,'p'],['records',[...records,...trash],'r']]){
        const snap=await this.fs.collection(kind).get({source:'server'}),cloud=new Map(snap.docs.map(d=>[d.id,d.data()])),seen=this.seen(k);
        for(const v of list){const c=cloud.get(v.id);
          if(!c&&seen.has(v.id))continue;
          if(!c||(v.updated||0)>(c.updated||0)){if(kind==='records'&&!c)(v.photos||[]).forEach(p=>p.up=false);this.push(kind,v);n++}}
      }
    }catch(e){if(navigator.onLine&&e.code==='permission-denied')this.fail(e)}
    return n;
  }
};
/* 空間資料（房名＋軸線）：存在雲端 meta/rooms，只有名單內帳號可讀；本機快取供離線使用 */
function setRooms(o){if(o&&o.dorm)DORM_ROOMS=o.dorm;if(o&&o.med2)MED2_ROOMS=o.med2}
try{setRooms(JSON.parse(LS.get('roomsCache')||'null'))}catch(e){}
let roomsErr='';
async function loadRoomsCloud(){
  if(!Cloud.on){roomsErr='尚未登入';return}
  try{const d=await Cloud.fs.collection('meta').doc('rooms').get({source:'server'});if(!d.exists){roomsErr='雲端尚無空間資料，請管理者上傳';return}roomsErr='';
    {const o=JSON.parse(d.data().json);setRooms(o);LS.set('roomsCache',JSON.stringify(o));roomsChanged()}}catch(e){roomsErr=(e.code==='permission-denied'?'沒有讀取權限（帳號未加入名單）':e.code==='unavailable'?'目前離線，恢復網路後再試':'讀取失敗：'+(e.code||e.message))}
  if($('#setDlg').open)renderCloudBox()
}
function roomsChanged(){if(!cur)return softRender();if($('#sleeves')||$('#slabs')||$('#dfits'))refreshPhotos();else if($('#l_space_w'))$('#l_space_w').outerHTML=spaceLocField(cur)}
function roomsSummary(){const a=Object.keys(MED2_ROOMS).length,b=Object.keys(DORM_ROOMS).length;return a||b?`空間資料：二期 ${a} 層、宿舍 ${b} 層`:`空間資料：尚未載入${roomsErr?'（'+roomsErr+'）':(Cloud.user?'':'（尚未登入）')}`}
async function uploadRooms(file){
  try{const txt=await file.text(),o=JSON.parse(txt);if(o.app!=='site-inspection-rooms')throw new Error('這不是空間資料檔');
    if(!Cloud.on)throw new Error('請先登入');
    await Cloud.fs.collection('meta').doc('rooms').set({json:JSON.stringify({dorm:o.dorm||{},med2:o.med2||{}}),version:o.version||'',updated:Date.now(),by:Cloud.user.email});
    setRooms(o);LS.set('roomsCache',JSON.stringify({dorm:o.dorm||{},med2:o.med2||{}}));toast('空間資料已上傳，所有人登入後都會套用');renderCloudBox();
  }catch(e){toast('上傳失敗：'+(e.message||e))}
}
async function ensurePhotos(r){
  if(!Cloud.fs||!r||!r.photos)return 0;
  const miss=r.photos.filter(p=>!p.src&&p.id&&!p.tried);if(!miss.length)return 0;
  let n=0;
  await Promise.all(miss.map(async p=>{try{const d=await Cloud.fs.collection('photos').doc(p.id).get();p.src=(d.data()||{}).data||'';if(p.src)n++;else p.tried=true}catch(e){p.tried=true}}));
  if(n)_put('records',r);
  return n;
}
function softRender(){
  const h=location.hash;
  if(/^#rec-/.test(h)){if(!records.some(x=>'#rec-'+x.id===h))render();return}
  if(/^#print/.test(h))return;
  const y=scrollY;render();scrollTo(0,y);
}
function parseCfg(t){
  const m=t.match(/\{[\s\S]*\}/);if(!m)throw 0;
  const j=m[0].replace(/\/\/.*$/gm,'').replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}');
  const c=JSON.parse(j);if(!c.apiKey||!c.projectId)throw 0;return c;
}
function renderCloudBox(){
  const b=$('#cloudBox'),C=Cloud;
  if(!C.cfg()){
    b.innerHTML=`<b>雲端同步：尚未設定</b>
      <p class="muted" style="margin:0">設定後，手機拍的照片和填的紀錄會自動上傳，電腦打開同一個網址就能看到並列印。請貼上 Firebase 專案的設定（firebaseConfig）。</p>
      <textarea id="cfgIn" placeholder="const firebaseConfig = {&#10;  apiKey: &quot;...&quot;,&#10;  authDomain: &quot;...&quot;,&#10;  projectId: &quot;...&quot;,&#10;  ...&#10;};"></textarea>
      <div class="row"><button class="btn primary" id="cfgSave">儲存設定並啟用</button></div>`;
    $('#cfgSave').onclick=()=>{try{const c=parseCfg($('#cfgIn').value);LS.set('fbcfg',JSON.stringify(c));toast('設定已儲存，正在連線');C.init().then(renderCloudBox)}catch(e){toast('看不懂這段設定，請整段貼上 firebaseConfig')}};
    return;
  }
  const st={off:'未啟用',signedout:'未登入',syncing:'同步中…',synced:'已同步，所有資料都已上傳',offline:'離線中',error:'同步錯誤'}[C.state]||C.state;
  b.innerHTML=`<div class="row"><b class="grow">雲端同步：${st}</b></div>
    ${C.msg?`<p class="muted" style="margin:0">${esc(C.msg)}</p>`:''}
    ${C.user?`<p class="muted" style="margin:0">登入帳號：${esc(C.user.email)}</p>
      <div class="row"><button class="btn primary" id="syncNow">立即同步（一鍵上傳）</button><button class="btn" id="signOut">登出</button></div>
      <div class="row"><span class="muted grow">${roomsSummary()}</span><button class="btn small" id="roomsReload" type="button">重新載入</button><label class="btn small">上傳空間資料<input type="file" id="roomsIn" accept=".json,application/json" hidden></label></div>`
     :C.fs?`<p class="muted" style="margin:0">用 Google 帳號登入後才會上傳。手機和電腦要登入已授權的帳號。</p>
      <div class="row"><button class="btn primary" id="signIn">用 Google 帳號登入</button></div>`:''}
    ${CLOUD_CONFIG?'':`<button class="btn small" id="cfgClear" style="align-self:flex-start">移除雲端設定</button>`}`;
  if($('#signIn'))$('#signIn').onclick=()=>C.signIn();
  if($('#signOut'))$('#signOut').onclick=()=>C.signOut();
  if($('#cfgClear'))$('#cfgClear').onclick=()=>{LS.set('fbcfg','');location.reload()};
  if($('#roomsReload'))$('#roomsReload').onclick=async()=>{toast('重新載入空間資料…');await loadRoomsCloud();toast(roomsSummary())};
  if($('#roomsIn'))$('#roomsIn').onchange=e=>{const f=e.target.files[0];if(f)uploadRooms(f);e.target.value=''};
  if($('#syncNow'))$('#syncNow').onclick=async e=>{const btn=e.currentTarget;btn.disabled=true;btn.textContent='上傳中…';
    await flush();const n=await C.migrate();
    for(const r of records)if(r.photos&&r.photos.some(p=>p.src&&!p.up))C.push('records',r);
    try{await Promise.race([C.fs.waitForPendingWrites(),new Promise((_,no)=>setTimeout(no,20000))]);toast(n?`已上傳 ${n} 筆，全部同步完成`:'全部資料都已同步')}
    catch(_){toast(navigator.onLine?'仍在上傳，請稍候':'目前離線，恢復網路後會自動上傳')}
    if(btn.isConnected){btn.disabled=false;btn.textContent='立即同步（一鍵上傳）'}C.pending()};
}
$('#cloudBtn').onclick=()=>$('#setBtn').click();

/* ---------- 自動更新：偵測到新版本就立即套用 ---------- */
let updating=false;
async function checkUpdate(){
  if(updating||!navigator.onLine||!location.protocol.startsWith('http'))return;
  try{
    const t=await (await fetch('index.html?v='+Date.now(),{cache:'no-store'})).text();
    const m=t.match(/APP_VERSION='([^']+)'/);if(!m||m[1]===APP_VERSION)return;
    const editing=/^#rec-/.test(location.hash);
    if(editing&&document.visibilityState==='visible'){showUpdateBar(m[1]);return}
    let tried='';try{tried=sessionStorage.getItem('updTried')||''}catch(_){}
    if(tried===m[1]){showUpdateBar(m[1]);return}   // 已重新載入過仍是舊版，避免重複重整
    updating=true;await flush();goVersion(m[1]);
  }catch(e){}
}
function goVersion(v){try{sessionStorage.setItem('updTried',v)}catch(_){}
  location.replace(location.pathname+'?v='+encodeURIComponent(v)+location.hash)}
function showUpdateBar(v){
  if($('#updBar'))return;
  const b=document.createElement('button');b.id='updBar';b.className='updbar';b.type='button';
  b.textContent=`已有新版本（${v}），點此立即更新（目前內容會先儲存）`;
  b.onclick=async()=>{updating=true;b.textContent='更新中…';await flush();goVersion(v+'-'+Date.now())};
  document.body.appendChild(b);
}
function startUpdateCheck(){
  setInterval(checkUpdate,60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
  addEventListener('online',checkUpdate);
  addEventListener('hashchange',()=>{if(!/^#rec-/.test(location.hash)&&$('#updBar'))checkUpdate()});
  setTimeout(checkUpdate,3000);
}

/* ---------- 啟動 ---------- */
(async()=>{
  try{await DB.open();projects=await DB.all('projects');records=await DB.all('records');splitTrash();purgeTrash();await splitSlabRecords();
    // 首次開啟時預設建立標案（固定 id，手機與電腦匯入備份時會合併成同一個；刪除後不會再自動出現）
    if(!LS.get('seeded2')){
      const PRESET=[
        {id:'p-nycuh-med2',name:'第二期醫療大樓興建工程',owner:'國立陽明交通大學附設醫院',pm:'誠蓄工程顧問股份有限公司',sup:'劉培森建築師事務所',con:'崇偉營造工程(股)有限公司'},
        {id:'p-nycuh-dorm',name:'職務宿舍興建工程',owner:'國立陽明交通大學附設醫院',pm:'誠蓄工程顧問(股)公司',sup:'劉培森建築師事務所',con:'崇偉營造工程(股)有限公司'}];
      for(const x of PRESET){if(!proj(x.id)){const p={...x,no:'',created:Date.now(),updated:1};await DB.put('projects',p);projects.push(p)}}
      if(!curProj)curProj=PRESET[0].id;
    }
    LS.set('seeded2','1');}
  catch(e){$('#view').innerHTML='<div class="empty">此瀏覽器無法儲存資料（可能是無痕模式）。請改用一般模式開啟。</div>';return}
  for(const r of records)if(r.mode==='mat'&&r.cat!=='mat'){r.cat='mat';r.type=r.type==='hang'?'pvcB':'box';await DB.put('records',r)}
  for(const r of records)if(r.mode==='mat'&&r.type==='pipe'){r.type='pvcB';await DB.put('records',r)}
  for(const r of records)if(r.mode==='mat'&&PIPE_STD[r.type]){r.sub=r.type;r.type=r.type.startsWith('pvc')?'pvc':'gi';await DB.put('records',r)}
  render();
  Cloud.init();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{setInterval(()=>reg.update().catch(()=>{}),60000)}).catch(()=>{});
  }
  startUpdateCheck();
})();
</script>
